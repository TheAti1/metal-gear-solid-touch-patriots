name: Verified Windows release
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-2022
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.320'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Source and packaging checks
        shell: pwsh
        run: |
          python tools/check_repository.py
          if($LASTEXITCODE -ne 0){throw 'Repository check failed'}
          python tools/check_language_templates.py
          if($LASTEXITCODE -ne 0){throw 'Language check failed'}
          python -m pip install jsonschema==4.23.0
          if($LASTEXITCODE -ne 0){throw 'Schema dependency failed'}
          python tools/test_recomplauncher.py
          if($LASTEXITCODE -ne 0){throw 'SDK check failed'}
          python tools/test_pc_release.py
          if($LASTEXITCODE -ne 0){throw 'Release packaging check failed'}
      - name: Build launcher twice and compare bytes
        shell: pwsh
        run: |
          ./launcher/build.ps1
          ./launcher/build.ps1 -PackageRoot ./build/rebuild
          $first=(Get-FileHash './package/Metal Gear Solid Touch.exe' -Algorithm SHA256).Hash
          $second=(Get-FileHash './build/rebuild/Metal Gear Solid Touch.exe' -Algorithm SHA256).Hash
          if($first -ne $second){throw 'Launcher rebuild was not deterministic'}
          Write-Output "Reproducible launcher SHA256: $first"
      - name: Launcher, Unicode, language import and Discord IPC tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory ./package/Localization -Force | Out-Null
          Copy-Item ./localization/stages.json ./package/Localization/stages.json
          foreach($arg in @('--test-launcher','--test-language-packs','--test-discord')){
            $test=Start-Process './package/Metal Gear Solid Touch.exe' -ArgumentList $arg -Wait -PassThru -WindowStyle Hidden
            if($test.ExitCode -ne 0){throw "$arg failed with exit $($test.ExitCode)"}
          }
          $framework=Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319'
          $reference=(Resolve-Path 'package/Metal Gear Solid Touch.exe').Path
          $source=(Resolve-Path 'tools/tests/RecompSettingsProbe.cs').Path
          $output=Join-Path (Resolve-Path 'package').Path 'RecompSettingsProbe.exe'
          & (Join-Path $framework 'csc.exe') @('/nologo','/target:exe','/r:System.Web.Extensions.dll',('/r:'+$reference),('/out:'+$output),$source)
          if($LASTEXITCODE -ne 0){throw 'Settings probe build failed'}
          & ./package/RecompSettingsProbe.exe ./recomplauncher.json
          if($LASTEXITCODE -ne 0){throw 'Preferences contract failed'}
          $test=Start-Process './package/Metal Gear Solid Touch.exe' -ArgumentList '--recomplauncher' -Wait -PassThru -WindowStyle Hidden
          if($test.ExitCode -ne 20){throw 'Incomplete package must report exit 20'}
      - name: Record Microsoft Defender scan when available
        shell: pwsh
        run: |
          $status=Get-MpComputerStatus -ErrorAction SilentlyContinue
          $receipt=[ordered]@{scanner='Microsoft Defender';scope='source-built launcher';available=$false;result='not-run'}
          if($status -and $status.AntivirusEnabled){
            $receipt.available=$true
            $receipt.signature_version=$status.AntivirusSignatureVersion
            $receipt.signature_date=$status.AntivirusSignatureLastUpdated.ToUniversalTime().ToString('o')
            $tool=Get-ChildItem 'C:/ProgramData/Microsoft/Windows Defender/Platform/*/MpCmdRun.exe' | Sort-Object FullName -Descending | Select-Object -First 1
            if(!$tool){throw 'Defender enabled but scanner not found'}
            & $tool.FullName -Scan -ScanType 3 -File (Resolve-Path './package/Metal Gear Solid Touch.exe').Path -DisableRemediation
            if($LASTEXITCODE -ne 0){throw "Defender scan failed or detected a threat: $LASTEXITCODE"}
            $receipt.result='no-threats-found'
          }
          $receipt | ConvertTo-Json | Set-Content './build/defender.json' -Encoding utf8
      - name: Package pinned base with source-built launcher
        shell: pwsh
        run: |
          python tools/package_pc_release.py
          if($LASTEXITCODE -ne 0){throw 'Windows packaging failed'}
      - name: Attest release archives and source-built launcher
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            dist/*.zip
            package/Metal Gear Solid Touch.exe
      - name: Include verifiable GitHub attestation bundle
        shell: pwsh
        env:
          ATTESTATION_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          Copy-Item -LiteralPath $env:ATTESTATION_BUNDLE -Destination './dist/github-attestation.jsonl'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: touch-pc-1.2.1-verified-release
          path: dist/
          if-no-files-found: error
      - name: Upload draft for final native-game verification
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets=@(Get-ChildItem -File ./dist | ForEach-Object FullName)
          gh release create v1.2.1 @assets --draft --target $env:GITHUB_SHA --title 'Patriots PC 1.2.1 · Verified Windows build' --notes-file ./docs/RELEASE-1.2.1.md
          if($LASTEXITCODE -ne 0){throw 'Draft release upload failed'}
